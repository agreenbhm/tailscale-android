name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release artifacts
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          make tailscale-debug.apk

          if [ -n "${ANDROID_KEYSTORE_B64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "Signing release bundles with configured keystore"
            echo "${ANDROID_KEYSTORE_B64}" | base64 --decode > tailscale-release.jks
            export JKS_PATH="$PWD/tailscale-release.jks"
            export JKS_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}"
            make release release-tv
          else
            echo "No signing secrets found; building unsigned release bundles"
            make tailscale-release.aab tailscale-tv-release.aab
          fi

          sha256sum tailscale-debug.apk tailscale-release.aab tailscale-tv-release.aab > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            tailscale-debug.apk
            tailscale-release.aab
            tailscale-tv-release.aab
            SHA256SUMS
